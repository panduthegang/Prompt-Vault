<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&amp;display=swap');
      .logo-text {
        font-family: 'Instrument Serif', Georgia, serif;
        font-style: italic;
        font-weight: 400;
        font-size: 270px;
        fill: #F1F78C;
        text-anchor: middle;
        dominant-baseline: central;
      }
      .accent-dot {
        fill: #1ECC62;
      }
    </style>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002D0F" />
      <stop offset="100%" stop-color="#01220B" />
    </linearGradient>
  </defs>

  <!-- Background Tile with 2px brand border styling -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="#1ECC62" stroke-width="12" stroke-opacity="0.3" />

  <!-- Monogram PV Text in Instrument Serif Italic -->
  <!-- Using text with fallback positioning and decorative flourish -->
  <g transform="translate(256, 250)">
    <!-- Fallback decorative subtle shadow -->
    <text x="3" y="3" class="logo-text" fill="#001807" opacity="0.6">PV</text>
    <text x="0" y="0" class="logo-text">PV</text>
  </g>

  <!-- Neo-Brutalist Brand Accent Indicator Dot -->
  <circle cx="396" cy="160" r="22" class="accent-dot" stroke="#002D0F" stroke-width="6" />
</svg>
